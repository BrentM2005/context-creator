name: Build Executables (GUI & CLI)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-gui:
    name: Build GUI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    defaults:
      run:
        working-directory: ./context-creator-gui

    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: ContextCreator-GUI-Windows
            build_cmd: pyinstaller --noconsole --noconfirm --onefile --name "ContextCreator" --icon="logo.ico" --add-data "logo.png;." --copy-metadata tiktoken --hidden-import pyperclip main.py
            output_path: context-creator-gui/dist/ContextCreator.exe
            
          - os: ubuntu-latest
            asset_name: ContextCreator-GUI-Linux
            build_cmd: pyinstaller --noconsole --noconfirm --onefile --name "ContextCreator" --icon="logo.png" --add-data "logo.png:." --copy-metadata tiktoken --hidden-import pyperclip main.py
            output_path: context-creator-gui/dist/ContextCreator

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install GUI Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller pyside6 qtawesome tiktoken pyperclip

    - name: Ensure OS dependencies for PySide6 (Linux only)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libxcb-cursor0

    - name: Build GUI with PyInstaller
      run: ${{ matrix.build_cmd }}

    - name: Upload GUI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.output_path }}

  build-cli:
    name: Build CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    
    defaults:
      run:
        working-directory: ./context-creator-cli

    strategy:
      matrix:
        include:
          - os: windows-latest
            asset_name: ContextCreator-CLI-Windows
            build_cmd: pyinstaller --noconfirm --onefile --name "context-creator" --hidden-import pyperclip --copy-metadata tiktoken main.py
            output_path: context-creator-cli/dist/context-creator.exe
            
          - os: ubuntu-latest
            asset_name: ContextCreator-CLI-Linux
            build_cmd: pyinstaller --noconfirm --onefile --name "context-creator" --hidden-import pyperclip --copy-metadata tiktoken main.py
            output_path: context-creator-cli/dist/context-creator

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install CLI Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller tiktoken pyperclip

    - name: Build CLI with PyInstaller
      run: ${{ matrix.build_cmd }}

    - name: Upload CLI Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.asset_name }}
        path: ${{ matrix.output_path }}

  release:
    name: Create Release + Upload Assets
    runs-on: ubuntu-latest
    needs: [build-gui, build-cli]

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Display structure (debug)
        run: ls -R dist

      - name: Create Release and Upload Files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: |
            dist/**/ContextCreator.exe
            dist/**/ContextCreator
            dist/**/context-creator.exe
            dist/**/context-creator
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}